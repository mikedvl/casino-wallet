services:
  postgres:
    image: postgres:16.15-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casino_wallet}
      POSTGRES_USER: ${POSTGRES_USER:-casino_wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casino_wallet}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-casino_wallet}
      DB_USER: ${POSTGRES_USER:-casino_wallet}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-casino_wallet}
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 6s
      start_period: 60s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
