map $http_x_request_id $correlation_id {
    default $request_id;
    "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
}

map $upstream_http_x_request_id $response_request_id {
    default $upstream_http_x_request_id;
    "" $correlation_id;
}

log_format request_json escape=json
    '{"request_id":"$response_request_id","method":"$request_method",'
    '"path":"$uri","status":$status,"duration":$request_time,'
    '"upstream_duration":"$upstream_response_time"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout request_json;
    error_log /dev/stderr warn;
    add_header X-Request-ID $response_request_id always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $correlation_id;
    proxy_hide_header X-Request-ID;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
